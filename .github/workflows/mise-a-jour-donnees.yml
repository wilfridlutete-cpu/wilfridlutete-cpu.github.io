name: Mise à jour des données

on:
  schedule:
    - cron: "17 2 * * *"   # chaque nuit vers 4 h, heure belge (02:17 UTC)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 6 requêtes Overpass (bornes + communes par région)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les bornes depuis OpenStreetMap
        run: python bornes/scripts/fetch_bornes.py

      - name: Publier si les données ont changé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bornes/data/
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données : mise à jour du $(date -u +%Y-%m-%d)"
            git push
          fi
